name: Anúncios do administrador
# Fica de plantão quase 6 horas seguidas, conferindo a cada minuto os anúncios publicados
# pelo administrador e os pedidos dos ouvintes. No fim, chama a si mesmo de novo.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: vigia
  cancel-in-progress: false
jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Voz Francisca (anúncios novos)
        run: pipx install edge-tts || python3 -m pip install --user --break-system-packages edge-tts
      - name: Plantão
        run: |
          git config user.name "Rádio ECONTEC"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FIM=$(( $(date +%s) + 335*60 )); ULT=0
          while [ "$(date +%s)" -lt "$FIM" ]; do
            git pull -q --rebase --autostash origin Econtec_Radio || git rebase --abort || true
            timeout 240 node scripts/anuncios.mjs || true
            # Acervo de músicas: uma vez por dia (madrugada), renova parte dos artistas e guarda os pedidos novos (valem a partir de amanhã)
            DIAH=$(TZ=America/Sao_Paulo date +%F); HR=$(TZ=America/Sao_Paulo date +%H)
            if [ "$HR" -ge 2 ] && [ "$HR" -lt 5 ] && [ "$(cat .acervo-dia 2>/dev/null)" != "$DIAH" ]; then
              echo "$DIAH" > .acervo-dia; timeout 1800 node scripts/acervo.mjs || true
            fi
            git add -A
            if ! git diff --cached --quiet; then
              URG=0
              git diff --cached --name-only | grep -qE '^(aovivo|musicas|clientes|cadastros|homenagem/|audios|nomes-voz|v/a/|v/pn/|v/anuncio|v/ho/|pedidos/|especiais|piadas-ouvintes|v/es/|v/inf/)' && URG=1
              if [ "$URG" = 1 ] || [ $(( $(date +%s) - ULT )) -ge 600 ]; then
                git commit -qm "Anúncios e pedidos atualizados" && \
                git push -q origin HEAD:Econtec_Radio && ULT=$(date +%s) && \
                (git push -q origin HEAD:main || true)
              fi
            fi
            sleep 20
          done
      - name: Chamar o próximo plantão
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run anuncios.yml --ref Econtec_Radio -R "$GITHUB_REPOSITORY" || true
